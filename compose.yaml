name: infra-lab
services:
  api:
    image: infra-lab-control:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8088:8000"
    volumes:
      - state:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      INFRA_DATA: /data
      INFRA_ALLOWED_HOSTS: ${INFRA_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}
      INFRA_NGINX_IMAGE: ${INFRA_NGINX_IMAGE:-nginx:1.28.0-alpine}
      INFRA_APP_IMAGE: ${INFRA_APP_IMAGE:-infra-lab-app:1.3.1}
      INFRA_REDIS_IMAGE: ${INFRA_REDIS_IMAGE:-redis:7.4.7-alpine}
    mem_limit: 160m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  worker:
    image: infra-lab-control:0.1.0
    command: ["python", "-m", "infra.worker"]
    volumes:
      - state:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      INFRA_DATA: /data
      INFRA_TOTAL_MEMORY_MB: ${INFRA_TOTAL_MEMORY_MB:-768}
      INFRA_NGINX_IMAGE: ${INFRA_NGINX_IMAGE:-nginx:1.28.0-alpine}
      INFRA_APP_IMAGE: ${INFRA_APP_IMAGE:-infra-lab-app:1.3.1}
      INFRA_REDIS_IMAGE: ${INFRA_REDIS_IMAGE:-redis:7.4.7-alpine}
    mem_limit: 160m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  portal:
    image: infra-lab-control:0.1.0
    command: ["uvicorn", "infra.portal:app", "--host", "127.0.0.1", "--port", "8089"]
    network_mode: host
    volumes:
      - state:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      INFRA_DATA: /data
      INFRA_NGINX_IMAGE: ${INFRA_NGINX_IMAGE:-nginx:1.28.0-alpine}
      INFRA_APP_IMAGE: ${INFRA_APP_IMAGE:-infra-lab-app:1.3.1}
      INFRA_REDIS_IMAGE: ${INFRA_REDIS_IMAGE:-redis:7.4.7-alpine}
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  state:
