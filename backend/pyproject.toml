[project]
name = "infra-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "docker>=7.1,<8", "pydantic>=2.10,<3", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
